name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  DEEPINFER_SHA: 9bd9cf243fc53ef9afbf8f04d391d989117d6ab9

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # lastUpdated 需要完整 git 历史
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Check DeepInfer source references
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/deepseek-ai/DeepInfer /tmp/DeepInfer
          git -C /tmp/DeepInfer checkout "$DEEPINFER_SHA"
          python3 scripts/check_refs.py /tmp/DeepInfer
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
