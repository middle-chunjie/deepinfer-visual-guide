<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" color="#111A23"><title>序列状态机：WAITING 到 RUNNING 到各种 FINISHED，抢占时回到 WAITING</title><style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei','IBM Plex Sans',sans-serif}text:not([fill]){fill:#111A23}.m{font-family:'JetBrains Mono',Menlo,Consolas,monospace}</style><rect x="0" y="0" width="760" height="150" rx="10" fill="#FFFFFF"/>
      <defs><marker id="ar5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path></marker></defs>
      <g font-size="12" class="m">
        <rect x="10" y="50" width="120" height="40" rx="20" fill="#FFFFFF" stroke="currentColor" stroke-opacity=".6"></rect><text x="70" y="75" text-anchor="middle">WAITING</text>
        <rect x="250" y="50" width="120" height="40" rx="20" fill="#DCE2FB" stroke="#2F49D8"></rect><text x="310" y="75" text-anchor="middle">RUNNING</text>
        <rect x="500" y="8" width="250" height="134" rx="10" fill="#FFFFFF" stroke="#CDD5DD"></rect>
        <g font-size="11"><text x="514" y="30">FINISHED_STOPPED  (EOS)</text><text x="514" y="50">FINISHED_LENGTH_CAPPED</text><text x="514" y="70">FINISHED_ABORTED</text><text x="514" y="90">FINISHED_PREEMPTED</text><text x="514" y="110">FINISHED_SO_FAILED</text><text x="514" y="130">FINISHED_VE_FAILED / IGNORED</text></g>
      </g>
      <g stroke="currentColor" stroke-opacity=".7" fill="none" marker-end="url(#ar5)"><line x1="132" y1="64" x2="247" y2="64"></line><path d="M250,84 C200,120 150,120 120,92"></path><line x1="372" y1="70" x2="497" y2="70"></line></g>
      <g font-size="10.5"><text x="190" y="56" text-anchor="middle">prefill 完成</text><text x="190" y="130" text-anchor="middle">抢占 → 重算</text><text x="435" y="62" text-anchor="middle">_check_stop</text></g>
    </svg>
