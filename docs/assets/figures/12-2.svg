<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220" color="#111A23"><title>一个 query 能看到的 key：最近 128 个 token 的 SWA KV，加上 indexer 从压缩 KV 中选出的 512 条</title><style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei','IBM Plex Sans',sans-serif}text:not([fill]){fill:#111A23}.m{font-family:'JetBrains Mono',Menlo,Consolas,monospace}</style><rect x="0" y="0" width="860" height="220" rx="10" fill="#FFFFFF"/>
      <g font-size="11.5">
        <text x="20" y="22" opacity=".8">位置 →（长度 L 的上下文）</text>
        <rect x="20" y="34" width="820" height="26" rx="4" fill="#E3E8ED"></rect>
        <g fill="#3D72CF" opacity=".9"><rect x="60" y="34" width="10" height="26"></rect><rect x="118" y="34" width="10" height="26"></rect><rect x="140" y="34" width="10" height="26"></rect><rect x="230" y="34" width="10" height="26"></rect><rect x="300" y="34" width="10" height="26"></rect><rect x="312" y="34" width="10" height="26"></rect><rect x="410" y="34" width="10" height="26"></rect><rect x="480" y="34" width="10" height="26"></rect><rect x="545" y="34" width="10" height="26"></rect><rect x="600" y="34" width="10" height="26"></rect><rect x="655" y="34" width="10" height="26"></rect><rect x="700" y="34" width="10" height="26"></rect></g>
        <rect x="740" y="34" width="100" height="26" fill="#0B8577"></rect><text x="790" y="51" text-anchor="middle" fill="#fff" font-size="11">SWA 128</text>
        <text x="380" y="80" text-anchor="middle" fill="#3D72CF">indexer 从压缩 KV 中选出的 top-512 条</text>
        <rect x="20" y="104" width="250" height="96" rx="8" fill="#FFFFFF" stroke="#CDD5DD"></rect>
        <text x="34" y="126" font-weight="600">① indexer 打分</text><text x="34" y="146" font-size="10.5">q_idx 来自 q_lora 潜变量</text><text x="34" y="162" font-size="10.5">k_idx 存在 ica_cache（FP4）</text><text x="34" y="178" font-size="10.5">score = relu(q·k)·w → top-512</text>
        <rect x="300" y="104" width="250" height="96" rx="8" fill="#FFFFFF" stroke="#CDD5DD"></rect>
        <text x="314" y="126" font-weight="600">② 拼 key 集合</text><text x="314" y="146" font-size="10.5">SWA 窗口（swa_cache，FP8）</text><text x="314" y="162" font-size="10.5">∪ 选中的压缩条目（ca_cache）</text><text x="314" y="178" font-size="10.5">+ attention sink</text>
        <rect x="580" y="104" width="260" height="96" rx="8" fill="#DCE2FB" stroke="#2F49D8"></rect>
        <text x="594" y="126" font-weight="600">③ FlashMLA 稀疏注意力</text><text x="594" y="146" font-size="10.5">64 个 query 头共享 1 个 512 维 latent KV</text><text x="594" y="162" font-size="10.5">RoPE 只作用在末 64 维</text><text x="594" y="178" font-size="10.5">输出分 8 组做低秩 out_proj</text>
      </g>
    </svg>
