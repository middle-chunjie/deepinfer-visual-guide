<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" color="#111A23"><title>上：eager 时 CPU 每发射一个 kernel，GPU 才能执行一个，中间有空隙；CUDA Graph 只需 CPU 一次重放，GPU 连续执行。下：每张图只适用于录制时的形状，实际 token 数不够时补到最近的桶</title><style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei','IBM Plex Sans',sans-serif}text:not([fill]){fill:#111A23}.m{font-family:'JetBrains Mono',Menlo,Consolas,monospace}</style><rect x="0" y="0" width="860" height="300" rx="10" fill="#FFFFFF"/><defs><marker id="aeg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#56636F"/></marker></defs><text x="20" y="18" font-size="12" font-weight="600">eager：CPU 发射一个，GPU 才能执行一个</text><text x="20" y="49" font-size="10.5" class="m" fill="#56636F">CPU</text><text x="20" y="73" font-size="10.5" class="m" fill="#56636F">GPU</text><rect x="100" y="36" width="82" height="18" rx="3" fill="#0B8577"/><rect x="184" y="60" width="36" height="18" rx="3" fill="#3D72CF"/><rect x="184" y="36" width="82" height="18" rx="3" fill="#0B8577"/><rect x="268" y="60" width="36" height="18" rx="3" fill="#3D72CF"/><rect x="268" y="36" width="82" height="18" rx="3" fill="#0B8577"/><rect x="352" y="60" width="36" height="18" rx="3" fill="#3D72CF"/><rect x="352" y="36" width="82" height="18" rx="3" fill="#0B8577"/><rect x="436" y="60" width="36" height="18" rx="3" fill="#3D72CF"/><rect x="436" y="36" width="82" height="18" rx="3" fill="#0B8577"/><rect x="520" y="60" width="36" height="18" rx="3" fill="#3D72CF"/><rect x="520" y="36" width="82" height="18" rx="3" fill="#0B8577"/><rect x="604" y="60" width="36" height="18" rx="3" fill="#3D72CF"/><text x="650" y="73" font-size="11">GPU 大部分时间在空等</text><text x="20" y="108" font-size="12" font-weight="600">CUDA Graph：CPU 一次重放，GPU 连续执行</text><text x="20" y="139" font-size="10.5" class="m" fill="#56636F">CPU</text><text x="20" y="163" font-size="10.5" class="m" fill="#56636F">GPU</text><rect x="100" y="126" width="82" height="18" rx="3" fill="#0B8577"/><text x="141.0" y="139" font-size="9.5" text-anchor="middle" fill="#fff">重放</text><rect x="184" y="150" width="35" height="18" rx="3" fill="#3D72CF"/><rect x="220" y="150" width="35" height="18" rx="3" fill="#3D72CF"/><rect x="256" y="150" width="35" height="18" rx="3" fill="#3D72CF"/><rect x="292" y="150" width="35" height="18" rx="3" fill="#3D72CF"/><rect x="328" y="150" width="35" height="18" rx="3" fill="#3D72CF"/><rect x="364" y="150" width="35" height="18" rx="3" fill="#3D72CF"/><line x1="400" y1="118" x2="400" y2="172" stroke="#56636F" stroke-dasharray="3 3"/><text x="408" y="163" font-size="11">同样 6 个 kernel，更早做完</text><text x="100" y="190" font-size="10" fill="#56636F">示意，不按真实时长；青 = CPU 发射 / 重放，蓝 = GPU 执行 kernel</text><line x1="20" y1="202" x2="840" y2="202" stroke="#CDD5DD"/><text x="20" y="224" font-size="12" font-weight="600">为什么要多张图：每张图只适用于录制时的形状</text><rect x="20" y="236" width="106" height="30" rx="6" fill="#FFFFFF" stroke="#CDD5DD" stroke-width="1"/><text x="73" y="255" font-size="11" text-anchor="middle">图 · 1 个 token</text><rect x="138" y="236" width="106" height="30" rx="6" fill="#FFFFFF" stroke="#CDD5DD" stroke-width="1"/><text x="191" y="255" font-size="11" text-anchor="middle">图 · 2</text><rect x="256" y="236" width="106" height="30" rx="6" fill="#FFFFFF" stroke="#CDD5DD" stroke-width="1"/><text x="309" y="255" font-size="11" text-anchor="middle">图 · 4</text><rect x="374" y="236" width="106" height="30" rx="6" fill="#DCE2FB" stroke="#2F49D8" stroke-width="1.6"/><text x="427" y="255" font-size="11" text-anchor="middle">图 · 8</text><rect x="492" y="236" width="106" height="30" rx="6" fill="#FFFFFF" stroke="#CDD5DD" stroke-width="1"/><text x="545" y="255" font-size="11" text-anchor="middle">图 · 16</text><text x="620" y="249" font-size="10.5">每张图里固定了：</text><text x="620" y="263" font-size="10.5">kernel 序列 · 张量形状 · 内存地址</text><text x="20" y="289" font-size="11">本步实际 5 个 token：</text><rect x="150" y="276" width="20" height="18" rx="3" fill="#3D72CF"/><rect x="174" y="276" width="20" height="18" rx="3" fill="#3D72CF"/><rect x="198" y="276" width="20" height="18" rx="3" fill="#3D72CF"/><rect x="222" y="276" width="20" height="18" rx="3" fill="#3D72CF"/><rect x="246" y="276" width="20" height="18" rx="3" fill="#3D72CF"/><rect x="270" y="276" width="20" height="18" rx="3" fill="#FFFFFF" stroke="#56636F" stroke-dasharray="3 2"/><rect x="294" y="276" width="20" height="18" rx="3" fill="#FFFFFF" stroke="#56636F" stroke-dasharray="3 2"/><rect x="318" y="276" width="20" height="18" rx="3" fill="#FFFFFF" stroke="#56636F" stroke-dasharray="3 2"/><line x1="348" y1="285" x2="376" y2="285" stroke="#56636F" stroke-width="1.5" marker-end="url(#aeg)"/><text x="384" y="289" font-size="11">补 3 个占位（虚线）凑成 8，重放「图 · 8」，占位的结果丢弃</text></svg>