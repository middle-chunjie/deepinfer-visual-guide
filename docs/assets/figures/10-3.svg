<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 232" width="860" height="232" color="#111A23"><title>左：N-1 步 4 个 token 只接受 1 个草稿，CPU 乐观记的 seqlen_k=108 要在 GPU 上减 2 变成 106。右：按累乘置信度排名，前 4 名拿到额外 token 名额</title><style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei','IBM Plex Sans',sans-serif}text:not([fill]){fill:#111A23}.m{font-family:'JetBrains Mono',Menlo,Consolas,monospace}</style><rect x="0" y="0" width="860" height="232" rx="10" fill="#FFFFFF"/><text x="20" y="18" font-size="12" font-weight="600">k 修正：上一步被拒的草稿要从长度里扣掉（nextn=3，接受 1 个）</text><text x="20" y="46" font-size="10.5" class="m" fill="#56636F">N-1 步</text><rect x="76" y="34" width="70" height="22" rx="3" fill="#FFFFFF" stroke="#D5DBE1"/><text x="111" y="49" font-size="10" text-anchor="middle" class="m">已确认 100</text><rect x="150" y="34" width="30" height="22" rx="3" fill="#3D72CF"/><text x="165" y="49" font-size="10" text-anchor="middle" class="m" fill="#fff">t0 ✓</text><rect x="184" y="34" width="30" height="22" rx="3" fill="#3D72CF"/><text x="199" y="49" font-size="10" text-anchor="middle" class="m" fill="#fff">d1 ✓</text><rect x="218" y="34" width="30" height="22" rx="3" fill="#FFFFFF" stroke="#C2412D" stroke-width="1.2" stroke-dasharray="3 2"/><text x="233" y="49" font-size="10" text-anchor="middle" class="m" fill="#C2412D">d2 ✗</text><rect x="252" y="34" width="30" height="22" rx="3" fill="#FFFFFF" stroke="#C2412D" stroke-width="1.2" stroke-dasharray="3 2"/><text x="267" y="49" font-size="10" text-anchor="middle" class="m" fill="#C2412D">d3 ✗</text><text x="20" y="92" font-size="10.5" class="m" fill="#56636F">N 步</text><rect x="76" y="80" width="70" height="22" rx="3" fill="#FFFFFF" stroke="#D5DBE1"/><text x="111" y="95" font-size="10" text-anchor="middle" class="m">100</text><rect x="150" y="80" width="30" height="22" rx="3" fill="#3D72CF"/><text x="165" y="95" font-size="10" text-anchor="middle" class="m" fill="#fff">t0</text><rect x="184" y="80" width="30" height="22" rx="3" fill="#3D72CF"/><text x="199" y="95" font-size="10" text-anchor="middle" class="m" fill="#fff">d1</text><rect x="218" y="80" width="30" height="22" rx="3" fill="#0B8577"/><text x="233" y="95" font-size="10" text-anchor="middle" class="m" fill="#fff">s</text><rect x="252" y="80" width="30" height="22" rx="3" fill="#0B8577"/><text x="267" y="95" font-size="10" text-anchor="middle" class="m" fill="#fff">n1</text><rect x="286" y="80" width="30" height="22" rx="3" fill="#0B8577"/><text x="301" y="95" font-size="10" text-anchor="middle" class="m" fill="#fff">n2</text><rect x="320" y="80" width="30" height="22" rx="3" fill="#0B8577"/><text x="335" y="95" font-size="10" text-anchor="middle" class="m" fill="#fff">n3</text><line x1="76" y1="112" x2="354" y2="112" stroke="#56636F"/><text x="76" y="128" font-size="11">真实 seqlen_k = 100 + 2 + 4 = <tspan font-weight="700">106</tspan></text><text x="76" y="146" font-size="11" fill="#56636F">CPU 乐观记 108（以为 d2 d3 也有效）</text><text x="76" y="164" font-size="11" fill="#56636F">GPU：108 − (3 − 1) = 106</text><text x="76" y="184" font-size="10.5" fill="#56636F">s=本步采样的 token，n1–n3=新草稿</text><line x1="410" y1="26" x2="410" y2="206" stroke="#D5DBE1"/><text x="430" y="18" font-size="12" font-weight="600">q 修正：把 token 预算给累乘置信度最高的位置（总预算 7）</text><rect x="430" y="91.0" width="30" height="99.0" rx="3" fill="#2F49D8"/><text x="445" y="86.0" font-size="10" text-anchor="middle" class="m">0.9</text><text x="445" y="204" font-size="10" text-anchor="middle" class="m" fill="#56636F">A1</text><rect x="474" y="110.8" width="30" height="79.2" rx="3" fill="#2F49D8"/><text x="489" y="105.8" font-size="10" text-anchor="middle" class="m">0.72</text><text x="489" y="204" font-size="10" text-anchor="middle" class="m" fill="#56636F">A2</text><rect x="518" y="124.0" width="30" height="66.0" rx="3" fill="#2F49D8"/><text x="533" y="119.0" font-size="10" text-anchor="middle" class="m">0.6</text><text x="533" y="204" font-size="10" text-anchor="middle" class="m" fill="#56636F">B1</text><rect x="562" y="134.6" width="30" height="55.4" rx="3" fill="#2F49D8"/><text x="577" y="129.6" font-size="10" text-anchor="middle" class="m">0.504</text><text x="577" y="204" font-size="10" text-anchor="middle" class="m" fill="#56636F">A3</text><rect x="606" y="157.0" width="30" height="33.0" rx="3" fill="#FFFFFF" stroke="#56636F"/><text x="621" y="152.0" font-size="10" text-anchor="middle" class="m">0.3</text><text x="621" y="204" font-size="10" text-anchor="middle" class="m" fill="#56636F">B2</text><rect x="650" y="176.8" width="30" height="13.2" rx="3" fill="#FFFFFF" stroke="#56636F"/><text x="665" y="171.8" font-size="10" text-anchor="middle" class="m">0.12</text><text x="665" y="204" font-size="10" text-anchor="middle" class="m" fill="#56636F">B3</text><text x="709" y="185.0" font-size="10" text-anchor="middle" class="m">0</text><text x="709" y="204" font-size="10" text-anchor="middle" class="m" fill="#56636F">C1</text><text x="753" y="185.0" font-size="10" text-anchor="middle" class="m">0</text><text x="753" y="204" font-size="10" text-anchor="middle" class="m" fill="#56636F">C2</text><text x="797" y="185.0" font-size="10" text-anchor="middle" class="m">0</text><text x="797" y="204" font-size="10" text-anchor="middle" class="m" fill="#56636F">C3</text><line x1="430" y1="190" x2="826" y2="190" stroke="#D5DBE1"/><line x1="599" y1="52" x2="599" y2="190" stroke="#56636F" stroke-dasharray="3 3"/><text x="606" y="62" font-size="10.5" fill="#56636F">额外名额 7−3=4，截在这里</text><text x="430" y="222" font-size="10.5" fill="#56636F">A1=A 的第 1 个草稿，值为累乘置信度。结果 seqlens_q：A=4，B=2，C(新请求)=1</text></svg>