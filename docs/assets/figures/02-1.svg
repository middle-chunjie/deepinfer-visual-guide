<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" color="#111A23"><title>DeepInfer 分层结构：入口、引擎、C++ 调度、Worker、模型、TileLang kernel、vendor kernel 库</title><style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei','IBM Plex Sans',sans-serif}text:not([fill]){fill:#111A23}.m{font-family:'JetBrains Mono',Menlo,Consolas,monospace}</style><rect x="0" y="0" width="860" height="400" rx="10" fill="#FFFFFF"/>
      <g font-size="12">
        <g><rect x="0" y="4" width="860" height="44" rx="7" fill="#FFFFFF" stroke="#CDD5DD"></rect><text x="16" y="31" font-weight="600">入口</text><text x="150" y="25" class="m" font-size="11.5">examples/offline_inference.py · benchmark.py · eval/run_eval.py</text><text x="150" y="41" class="m" font-size="11.5" opacity=".7">deepinfer/entrypoints/llm.py  →  class LLM.generate()</text></g>
        <g transform="translate(0,54)"><rect x="0" y="4" width="860" height="44" rx="7" fill="#FFFFFF" stroke="#CDD5DD"></rect><text x="16" y="31" font-weight="600">引擎（Python）</text><text x="150" y="25" class="m" font-size="11.5">deepinfer/engine/llm_engine.py  LLMEngine.step() / add_request()</text><text x="150" y="41" class="m" font-size="11.5" opacity=".7">arg_utils.py · config.py · environ.py（全部 DEEPINFER_* 环境变量）</text></g>
        <g transform="translate(0,108)"><rect x="0" y="4" width="860" height="44" rx="7" fill="#FFFFFF" stroke="#7E46CF" stroke-dasharray="5 3"></rect><text x="16" y="31" font-weight="600">调度（C++）</text><text x="150" y="25" class="m" font-size="11.5">csrc/engine/scheduler.hpp · block_manager.hpp · mtp_varlen.hpp · zos.cpp</text><text x="150" y="41" class="m" font-size="11.5" opacity=".7">经 pybind 暴露为 deepinfer._C.engine（类型桩见 deepinfer/_C/engine.pyi）</text></g>
        <g transform="translate(0,162)"><rect x="0" y="4" width="860" height="44" rx="7" fill="#FFFFFF" stroke="#CDD5DD"></rect><text x="16" y="31" font-weight="600">Worker</text><text x="150" y="25" class="m" font-size="11.5">deepinfer/worker/worker.py · model_runner.py · cache_engine.py</text><text x="150" y="41" class="m" font-size="11.5" opacity=".7">cuda_graph_runner.py · dflash_cuda_graph_runner.py · base.py（建组、显存 profile）</text></g>
        <g transform="translate(0,216)"><rect x="0" y="4" width="860" height="44" rx="7" fill="#FFFFFF" stroke="#CDD5DD"></rect><text x="16" y="31" font-weight="600">模型</text><text x="150" y="25" class="m" font-size="11.5">model_executor/models/deepseek.py · decoder_layer.py · v4_modules/* · mtp/dflash.py</text><text x="150" y="41" class="m" font-size="11.5" opacity=".7">layers/sampler.py · eplb/ · parallel_utils/ · input_metadata/ · ve/（多模态预处理）</text></g>
        <g transform="translate(0,270)"><rect x="0" y="4" width="860" height="44" rx="7" fill="#FFFFFF" stroke="#CDD5DD"></rect><text x="16" y="31" font-weight="600">自定义 kernel</text><text x="150" y="25" class="m" font-size="11.5">model_executor/layers/tilelang_ops/{cuda,asc}/*.py</text><text x="150" y="41" class="m" font-size="11.5" opacity=".7">KV 读写、采样、置信度、CP 镜像索引、结构化输出 mask…（ops.py 按平台分发）</text></g>
        <g transform="translate(0,324)"><rect x="0" y="4" width="860" height="44" rx="7" fill="#DCE2FB" stroke="#2F49D8"></rect><text x="16" y="31" font-weight="600">vendor 库</text><text x="150" y="25" class="m" font-size="11.5">FlashMLA · DeepGEMM · DeepEP · DeepSelect · TileKernels（git submodule，build_vendor.sh 编译）</text><text x="150" y="41" class="m" font-size="11.5" opacity=".7">昇腾分支：DeepEP-Ascend · DeepGEMM-Ascend</text></g>
        <text x="16" y="392" font-size="11" opacity=".75">另有：deep_cluster/（NUMA 绑核、硬件探测）· tests/（e2e PPL 基线、KL、batch-invariant）· eval/（AIME/HLE/GPQA）</text>
