<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" color="#111A23"><title>三种做法存的东西不同：GQA 让多个 Q 头共用少数 KV 头；MLA 只存一个低维 latent，K/V 用时还原；V4.1 把相邻 2 个 token 压成 1 条，并且 40 层里只有 4 层存，其余层复用</title><style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei','IBM Plex Sans',sans-serif}text:not([fill]){fill:#111A23}.m{font-family:'JetBrains Mono',Menlo,Consolas,monospace}</style><rect x="0" y="0" width="860" height="250" rx="10" fill="#FFFFFF"/><defs><marker id="akv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#56636F"/></marker></defs><line x1="295" y1="12" x2="295" y2="262" stroke="#D5DBE1"/><line x1="585" y1="12" x2="585" y2="262" stroke="#D5DBE1"/><text x="20" y="20" font-size="12" font-weight="600">GQA：多个 Q 头共用一组 KV</text><text x="20" y="38" font-size="10.5" fill="#56636F">每层每 token</text><text x="20" y="62" font-size="10.5" fill="#56636F">Q 头 ×8（实际 64）</text><circle cx="32" cy="80" r="9" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2"/><line x1="32" y1="89" x2="80" y2="130" stroke="#56636F" stroke-width="1.2"/><circle cx="66" cy="80" r="9" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2"/><line x1="66" y1="89" x2="80" y2="130" stroke="#56636F" stroke-width="1.2"/><circle cx="100" cy="80" r="9" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2"/><line x1="100" y1="89" x2="80" y2="130" stroke="#56636F" stroke-width="1.2"/><circle cx="134" cy="80" r="9" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2"/><line x1="134" y1="89" x2="80" y2="130" stroke="#56636F" stroke-width="1.2"/><circle cx="168" cy="80" r="9" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2"/><line x1="168" y1="89" x2="210" y2="130" stroke="#56636F" stroke-width="1.2"/><circle cx="202" cy="80" r="9" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2"/><line x1="202" y1="89" x2="210" y2="130" stroke="#56636F" stroke-width="1.2"/><circle cx="236" cy="80" r="9" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2"/><line x1="236" y1="89" x2="210" y2="130" stroke="#56636F" stroke-width="1.2"/><circle cx="270" cy="80" r="9" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2"/><line x1="270" y1="89" x2="210" y2="130" stroke="#56636F" stroke-width="1.2"/><rect x="30" y="130" width="100" height="26" rx="4" fill="#3D72CF"/><text x="80" y="147" font-size="10.5" text-anchor="middle" fill="#fff">KV 头 0</text><rect x="160" y="130" width="100" height="26" rx="4" fill="#3D72CF"/><text x="210" y="147" font-size="10.5" text-anchor="middle" fill="#fff">KV 头 1</text><text x="20" y="172" font-size="10.5" fill="#56636F">KV 头 ×2（实际 8）</text><text x="20" y="196" font-size="11">存：K、V 各 8 头 × 128 维</text><text x="20" y="214" font-size="11">= 4 KB / 层 / token（BF16）</text><text x="20" y="232" font-size="11" font-weight="700">× 80 层 = 320 KB</text><text x="310" y="20" font-size="12" font-weight="600">MLA：只存一个低维 latent</text><text x="310" y="38" font-size="10.5" fill="#56636F">每层每 token</text><rect x="390" y="50" width="100" height="24" rx="4" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2"/><text x="440" y="66" font-size="10.5" text-anchor="middle">隐状态 h</text><line x1="440" y1="74" x2="440" y2="96" stroke="#56636F" stroke-width="1.2" marker-end="url(#akv)"/><text x="448" y="90" font-size="10" fill="#56636F">下投影</text><rect x="370" y="98" width="140" height="28" rx="4" fill="#3D72CF"/><text x="440" y="116" font-size="10.5" text-anchor="middle" fill="#fff">latent 512 + rope 64</text><text x="516" y="116" font-size="10.5" font-weight="600" fill="#2F49D8">← 存这个</text><line x1="410" y1="126" x2="370" y2="150" stroke="#56636F" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#akv)"/><line x1="470" y1="126" x2="510" y2="150" stroke="#56636F" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#akv)"/><rect x="330" y="152" width="80" height="22" rx="4" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2" stroke-dasharray="3 2"/><text x="370" y="167" font-size="10.5" text-anchor="middle" fill="#56636F">K（各头）</text><rect x="470" y="152" width="80" height="22" rx="4" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2" stroke-dasharray="3 2"/><text x="510" y="167" font-size="10.5" text-anchor="middle" fill="#56636F">V（各头）</text><text x="440" y="188" font-size="10.5" text-anchor="middle" fill="#56636F">用时还原，不存（虚线）</text><text x="310" y="208" font-size="11">存：(512+64) × 2 B = 1152 B / 层 / token</text><text x="310" y="232" font-size="11" font-weight="700">× 61 层 = 68.6 KB</text><text x="600" y="20" font-size="12" font-weight="600">V4.1：压缩 + 只在 4 层存</text><text x="600" y="38" font-size="10.5" fill="#56636F">40 层里：实心=存 KV，空心=复用上一个实心层</text><rect x="600" y="46" width="30" height="22" rx="4" fill="#2F49D8"/><text x="615" y="61" font-size="9" text-anchor="middle" class="m" fill="#fff">2</text><rect x="632" y="46" width="30" height="22" rx="4" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2" stroke-dasharray="3 2"/><text x="647" y="61" font-size="9" text-anchor="middle" class="m" fill="#56636F">3–7</text><rect x="664" y="46" width="30" height="22" rx="4" fill="#2F49D8"/><text x="679" y="61" font-size="9" text-anchor="middle" class="m" fill="#fff">8</text><rect x="696" y="46" width="30" height="22" rx="4" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2" stroke-dasharray="3 2"/><text x="711" y="61" font-size="9" text-anchor="middle" class="m" fill="#56636F">9–13</text><rect x="728" y="46" width="30" height="22" rx="4" fill="#2F49D8"/><text x="743" y="61" font-size="9" text-anchor="middle" class="m" fill="#fff">14</text><rect x="760" y="46" width="30" height="22" rx="4" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2" stroke-dasharray="3 2"/><text x="775" y="61" font-size="9" text-anchor="middle" class="m" fill="#56636F">15–19</text><rect x="792" y="46" width="30" height="22" rx="4" fill="#2F49D8"/><text x="807" y="61" font-size="9" text-anchor="middle" class="m" fill="#fff">20</text><rect x="824" y="46" width="30" height="22" rx="4" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2" stroke-dasharray="3 2"/><text x="839" y="61" font-size="9" text-anchor="middle" class="m" fill="#56636F">21–39</text><text x="600" y="86" font-size="10.5" fill="#56636F">token</text><rect x="640" y="92" width="22" height="18" rx="3" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2"/><rect x="666" y="92" width="22" height="18" rx="3" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2"/><rect x="692" y="92" width="22" height="18" rx="3" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2"/><rect x="718" y="92" width="22" height="18" rx="3" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2"/><rect x="744" y="92" width="22" height="18" rx="3" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2"/><rect x="770" y="92" width="22" height="18" rx="3" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2"/><rect x="796" y="92" width="22" height="18" rx="3" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2"/><rect x="822" y="92" width="22" height="18" rx="3" fill="#FFFFFF" stroke="#56636F" stroke-width="1.2"/><rect x="640" y="134" width="48" height="18" rx="3" fill="#3D72CF"/><line x1="651" y1="110" x2="660" y2="134" stroke="#56636F" stroke-width="1.2" marker-end="url(#akv)"/><line x1="677" y1="110" x2="668" y2="134" stroke="#56636F" stroke-width="1.2" marker-end="url(#akv)"/><rect x="692" y="134" width="48" height="18" rx="3" fill="#3D72CF"/><line x1="703" y1="110" x2="712" y2="134" stroke="#56636F" stroke-width="1.2" marker-end="url(#akv)"/><line x1="729" y1="110" x2="720" y2="134" stroke="#56636F" stroke-width="1.2" marker-end="url(#akv)"/><rect x="744" y="134" width="48" height="18" rx="3" fill="#3D72CF"/><line x1="755" y1="110" x2="764" y2="134" stroke="#56636F" stroke-width="1.2" marker-end="url(#akv)"/><line x1="781" y1="110" x2="772" y2="134" stroke="#56636F" stroke-width="1.2" marker-end="url(#akv)"/><rect x="796" y="134" width="48" height="18" rx="3" fill="#3D72CF"/><line x1="807" y1="110" x2="816" y2="134" stroke="#56636F" stroke-width="1.2" marker-end="url(#akv)"/><line x1="833" y1="110" x2="824" y2="134" stroke="#56636F" stroke-width="1.2" marker-end="url(#akv)"/><text x="600" y="148" font-size="10.5" fill="#56636F">压缩</text><text x="640" y="170" font-size="10.5" fill="#56636F">C2 层：每 2 个 token 压成 1 条，FP4</text><text x="600" y="192" font-size="11">每条 288 B；加 indexer K 68 B</text><text x="600" y="210" font-size="11" font-weight="700">≈ 0.9 KB / token（估算）</text><text x="600" y="230" font-size="10.5" fill="#56636F">另有滑窗 KV，每请求固定，不随长度增长</text></svg>