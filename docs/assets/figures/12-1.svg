<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" color="#111A23"><title>每 token KV 字节数对数坐标对比：假想 MHA 2.5MB，Llama-3-70B GQA 320KB，DeepSeek-V3 MLA 68.6KB，V4.1-Flash 约 0.9KB</title><style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei','IBM Plex Sans',sans-serif}text:not([fill]){fill:#111A23}.m{font-family:'JetBrains Mono',Menlo,Consolas,monospace}</style><rect x="0" y="0" width="860" height="260" rx="10" fill="#FFFFFF"/>
      <g font-size="11.5">
        <g stroke="currentColor" stroke-opacity=".12"><line x1="230" y1="20" x2="230" y2="210"></line><line x1="350" y1="20" x2="350" y2="210"></line><line x1="470" y1="20" x2="470" y2="210"></line><line x1="590" y1="20" x2="590" y2="210"></line><line x1="710" y1="20" x2="710" y2="210"></line><line x1="830" y1="20" x2="830" y2="210"></line></g>
        <g class="m" font-size="10" text-anchor="middle" opacity=".75"><text x="230" y="226">100 B</text><text x="350" y="226">1 KB</text><text x="470" y="226">10 KB</text><text x="590" y="226">100 KB</text><text x="710" y="226">1 MB</text><text x="830" y="226">10 MB</text></g>
        <text x="530" y="248" text-anchor="middle" font-size="10.5" opacity=".8">每 token KV 字节（对数坐标，每格 ×10）</text>
        <text x="20" y="44">MHA（假想 70B，64 头）</text><rect x="230" y="30" width="530" height="22" rx="3" fill="#B8402A" opacity=".75"></rect><text x="767" y="46" class="m" font-size="10.5">2.5 MB</text>
        <text x="20" y="88">GQA（Llama-3.1-70B）</text><rect x="230" y="74" width="422" height="22" rx="3" fill="#C4521B" opacity=".85"></rect><text x="659" y="90" class="m" font-size="10.5">320 KB</text>
        <text x="20" y="132">MLA（DeepSeek-V3，BF16）</text><rect x="230" y="118" width="342" height="22" rx="3" fill="#3D72CF"></rect><text x="579" y="134" class="m" font-size="10.5">68.6 KB</text>
        <text x="20" y="176">V4.1-Flash 块 KV（估算）</text><rect x="230" y="162" width="114" height="22" rx="3" fill="#2F49D8"></rect><text x="351" y="178" class="m" font-size="10.5">≈0.9 KB + 每请求 ≈3 MB 滑窗</text>
      </g>
    </svg>
